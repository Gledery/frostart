<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>更新日志 | Frostart</title>
    <link rel="icon" href="icons/Frostart2606-64px.png" type="image/png">
    <link rel="apple-touch-icon" href="icons/Frostart2606-256px.png">
    <!-- 复用主站设计令牌 / 基础层 / 组件层：背景、玻璃、圆角、阴影、accent 全部对齐主站 -->
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/pages.css">
    <!-- 启动前同步主题与 accent-color（与转换工具一致）。
         MV3 默认 CSP 禁止内联脚本，必须用外部文件。 -->
    <script src="js/page-theme.js"></script>
    <style>
        /* main 成为主卡片：宽度/圆角/阴影/边框 完全对齐 PhasWer */
        .changelog-main {
            width: 1300px;
            max-width: 90%;
            margin: 120px auto 60px;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 0;
            background-color: var(--bg-primary);
            backdrop-filter: saturate(var(--saturation-amount)) blur(var(--blur-amount));
            -webkit-backdrop-filter: saturate(var(--saturation-amount)) blur(var(--blur-amount));
            border-radius: 75px;
            box-shadow: var(--shadow-xl);
            border: var(--border-glass);
            opacity: 0;
            animation: enter-fade-up var(--time-slow) var(--easing-enter) forwards;
        }

        /* hero 区域：完全对齐 PhasWer .page-hero（含入场动画 transition + .animate-in） */
        .changelog-hero {
            text-align: center;
            margin: 30px auto 0;
            max-width: 900px;
            padding: 30px;
            opacity: 0;
            transform: translateY(40px);
            transition: opacity 0.8s cubic-bezier(0.2, 0.8, 0.4, 1), transform 0.8s cubic-bezier(0.2, 0.8, 0.4, 1);
        }

        .changelog-hero.animate-in {
            opacity: 1;
            transform: translateY(0);
        }

        .changelog-hero h1 {
            font-size: 34px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 15px;
        }

        .changelog-hero p {
            font-size: 16px;
            line-height: 2;
            color: var(--text-secondary);
        }

        .changelog-hero p strong {
            color: var(--accent-color);
        }

        /* 透明内容容器（对齐 PhasWer .card.card-transparent） */
        .changelog-content {
            width: calc(97% - 80px);
            max-width: 1600px;
            margin: 40px auto;
            padding: 0;
        }

        .changelog-body {
            display: flex;
            gap: 30px;
        }

        /* 左侧版本导航 */
        .changelog-sidebar {
            width: 160px;
            flex-shrink: 0;
            position: sticky;
            top: 100px;
            max-height: calc(100vh - 120px);
            overflow-y: auto;
            scrollbar-width: none;
            overscroll-behavior: contain;
            padding: 12px 18px;
            border-radius: var(--radius-lg);
            border: var(--border-glass);
            box-shadow: var(--shadow-inset);
            background: var(--bg-secondary);
        }

        .changelog-sidebar::-webkit-scrollbar {
            display: none;
        }

        .sidebar-section-title {
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
            padding: 6px 12px;
            margin-top: 14px;
            opacity: 0.7;
        }

        .sidebar-section-title:first-child {
            margin-top: 0;
        }

        .sidebar-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 7px 12px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 500;
            color: var(--text-primary);
            cursor: pointer;
            white-space: nowrap;
            transition: all var(--time-fast) ease;
        }

        .sidebar-item:hover {
            background: var(--bg-hover);
        }

        .sidebar-item.active {
            background: var(--bg-active);
            font-weight: 600;
        }

        .sidebar-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        /* 右侧版本卡片列表 */
        .changelog-versions {
            flex: 1;
            min-width: 0;
        }

        .version-empty {
            padding: 48px 24px;
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
        }

        .version-card {
            margin-bottom: 12px;
            border-radius: var(--radius-md);
            overflow: hidden;
            border: var(--border-glass);
            background: var(--bg-secondary);
            border-left: 5px solid var(--divider-color);
            transition: box-shadow var(--time-fast) ease;
        }

        .version-card:hover {
            box-shadow: var(--shadow-md);
        }

        .version-card.highlight {
            box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent-color) 30%, transparent);
        }

        .version-card[data-level="major"] {
            border-left-color: #27ae60;
        }

        .version-card[data-level="minor"] {
            border-left-color: #6dbf8b;
        }

        .version-card[data-level="patch"] {
            border-left-color: #b8deca;
        }

        .version-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px 24px;
        }

        .version-badge {
            font-weight: 700;
            font-size: 17px;
            color: var(--text-primary);
            flex-shrink: 0;
        }

        .version-date {
            font-size: 15px;
            color: var(--text-secondary);
            flex-shrink: 0;
        }

        .version-body-inner {
            padding: 0 24px 18px 29px;
        }

        .change-item {
            padding: 7px 0;
            border-bottom: 1px solid var(--divider-color);
            font-size: 16px;
            line-height: 1.7;
            color: var(--text-primary);
        }

        .change-item:last-child {
            border-bottom: none;
        }

        @media (max-width: 768px) {
            .changelog-hero { padding: 20px 16px; }
            .changelog-hero h1 { font-size: 26px; }
            .changelog-hero p { font-size: 15px; }
            .changelog-content { width: calc(100% - 40px); margin: 20px auto; }
            .version-header { padding: 14px 18px; gap: 10px; }
            .version-badge { font-size: 16px; }
            .version-date { font-size: 14px; }
            .version-body-inner { padding: 0 18px 14px 23px; }
            .change-item { font-size: 15px; }
        }

        @media (max-width: 540px) {
            .changelog-hero { padding: 16px 12px; }
            .changelog-hero h1 { font-size: 24px; }
            .changelog-hero p { font-size: 14px; line-height: 1.8; }
            .changelog-content { width: calc(100% - 20px); margin: 15px auto; }
            .version-header { padding: 12px 14px; gap: 8px; }
            .version-badge { font-size: 15px; }
            .version-date { font-size: 13px; }
            .version-body-inner { padding: 0 14px 12px 19px; }
            .change-item { font-size: 14px; }
            .changelog-sidebar { display: none; }
            .changelog-body { gap: 0; }
        }
    </style>
</head>
<body>
    <!-- 壁纸层：与主站完全一致（渐变光斑 / 图片 / 遮罩） -->
    <div class="wallpaper-layer" aria-hidden="true">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>
    <div class="wallpaper-image" aria-hidden="true"></div>
    <div class="wallpaper-mask" aria-hidden="true"></div>

    <!-- 返回按钮：复用转换工具的同款玻璃按钮 -->
    <a href="newtab.html" class="converter-back glass-effect" title="返回新标签页">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
        返回新标签页
    </a>

    <main class="changelog-main">
        <section class="changelog-hero">
            <h1><br>屎山是怎样炼成的 :</h1>
            <p>
                <br>
                <strong>X.0.0</strong>：底层架构级调整，包括全局 CSS 架构重构、核心 JS 逻辑重写等<br>
                <strong>X.X.0</strong>：显著外观与功能调整，涉及整体视觉风格或核心功能模块变更<br>
                <strong>X.X.X</strong>：局部优化级变更，单页面/组件的细节修改、性能优化等<br>
                <strong>X.X.X Debugged</strong>：问题修复或轻量内容新增，不纳入此页面<br>
                *Beta 和 Debugged 版本被我吃了
            </p>
        </section>

        <div class="changelog-content">
            <div class="changelog-body">
                <nav class="changelog-sidebar" id="sidebar"></nav>
                <div class="changelog-versions" id="versionList"></div>
            </div>
        </div>
    </main>

    <script src="js/changelog.js"></script>
</body>
</html>
